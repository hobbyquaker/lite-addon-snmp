# etc/lighttpd.conf of lite-addon-snmp (MIT): openccu-lite proxies /addons/snmp/ to the daemon on
# the loopback and serves the 503 page while it is not running.
$HTTP["url"] == "/addons/snmp" {
    url.redirect = ("" => "/addons/snmp/")
}
$HTTP["url"] =~ "^/addons/snmp/" {
    proxy.server = ("/addons/snmp/" => (("host" => "127.0.0.1", "port" => 8296)))
    server.errorfile-prefix = "/usr/local/addons/snmp/www/lighttpd-error-"
}
