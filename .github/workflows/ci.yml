name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (codec, USM, agent, MIBs, source, config, api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go test -race ./...

  ui:
    name: ui (svelte-check, vitest, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npx playwright test
        working-directory: ui

  interop:
    name: interop (net-snmp and smilint in docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test/interop/run.sh

  package:
    name: packages (aarch64, x86_64, armv7l)
    runs-on: ubuntu-latest
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: VERSION=0.0.0-ci scripts/build.sh
      - run: tar tzf dist/snmp-x86_64-0.0.0-ci.tar.gz | sort
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          retention-days: 7
